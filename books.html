<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search and filter the Page & Paper e-book collection by title, author or category.">
  <title>Explore Books | Page & Paper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="books">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main-content">
    <section class="page-header">
      <div class="container">
        <h1 class="mb-2">Explore Books</h1>
        <p>Search by title or author, or narrow the collection by category. Open any book to read a free sample.</p>
      </div>
    </section>

    <section class="section-padding pt-5">
      <div class="container">
        <!-- Search and filters -->
        <div class="filter-bar mb-4">
          <form role="search" class="mb-3">
            <label for="search-input" class="form-label fw-semibold">Search books</label>
            <input type="search" id="search-input" class="form-control form-control-lg"
                   placeholder="Search by title or author" autocomplete="off">
          </form>
          <p class="fw-semibold mb-2" id="filter-label">Category</p>
          <div id="category-filters" class="d-flex flex-wrap gap-2" role="group" aria-labelledby="filter-label"></div>
        </div>

        <p id="results-status" class="text-muted" role="status" aria-live="polite"></p>

        <div class="row g-4" id="book-grid"></div>

        <div id="no-results" class="empty-state d-none">
          <h2 class="h4">No books match your search</h2>
          <p class="text-muted">Try a different title, author or category.</p>
          <button type="button" id="clear-filters" class="btn btn-navy">Clear search and filters</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
