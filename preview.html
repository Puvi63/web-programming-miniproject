<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read a free sample chapter before you buy at Page & Paper.">
  <title>Book Preview | Page & Paper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="preview" class="reading-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="site-header"></div>

  <!-- Reading toolbar -->
  <div class="reading-toolbar py-2">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <a id="back-to-details" href="books.html" class="btn btn-sm btn-outline-navy">&larr; Back to Details</a>
      <span id="preview-toolbar-title" class="small text-muted text-center flex-grow-1">Free sample</span>
      <div class="btn-group btn-group-sm" role="group" aria-label="Text size">
        <button type="button" id="font-smaller" class="btn btn-outline-navy" aria-label="Decrease text size">A&minus;</button>
        <button type="button" id="font-larger" class="btn btn-outline-navy" aria-label="Increase text size">A+</button>
      </div>
    </div>
  </div>

  <main id="main-content" class="container">
    <!-- Filled in by script.js using the ?id= value in the address bar -->
    <div id="preview-content"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
